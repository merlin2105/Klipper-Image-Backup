[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klipper-image-backup-manager"
version = "0.1.0"
description = "Safety-first diagnostics and offline backup preparation for Klipper hosts"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"kibm" = ["static/*"]
